name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  Build:
    if: "!contains(github.event.pull_request.labels.*.name, 'docs-only')"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]

    steps:
      - uses: compas-dev/compas-actions.build@v4
        with:
          invoke_lint: true
          invoke_test: true
          python: ${{ matrix.python }}

  OptionalBackends:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: compas-model-backends
          channels: conda-forge
          python-version: ${{ matrix.python }}
      - name: Install optional backends and project
        shell: bash -el {0}
        run: |
          conda install -y coal compas_occ
          python -m pip install -e ".[dev]"
      - name: Test optional backends
        shell: bash -el {0}
        run: |
          python -c "import coal; import compas_occ"
          pytest

  OptionalViewer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install viewer and project
        run: python -m pip install -e ".[dev,viz]"
      - name: Test viewer infrastructure
        run: pytest tests/test_viewer_*.py
