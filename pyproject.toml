[build-system]
requires = ["setuptools>=66.0"]
build-backend = "setuptools.build_meta"

# ============================================================================
# project info
# ============================================================================

[project]
name = "compas_model"
description = "This package provides a universal model datastructure for design, analysis, fabrication, and construction of AEC objects."
keywords = ["bim", "bam", "bom"]
authors = [
    { name = "tom van mele", email = "tom.v.mele@gmail.com" },
    { name = "petras vestartas", email = "petrasvestartas@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "compas>=3.0.0,<4",
    "mapbox-earcut >=2,<3",
    "numpy>=1.26",
    "scipy>=1.11.4",
    "shapely >=2.1",
]

[project.optional-dependencies]
viz = ["compas_viewer"]
collision = ["coal >=3.0,<4.0"]

[dependency-groups]
dev = [
    "build>=1.2",
    "bump-my-version>=1.2",
    "invoke>=2.2",
    "packaging>=24",
    "pyright==1.1.414",
    "pytest>=8",
    "pytest-dependency>=0.6",
    "ruff>=0.14",
    "twine>=6",
]
docs = [
    { include-group = "dev" },
    "markdown-callouts >=0.4",
    "markdown-exec >=1.8",
    "mike",
    "mkdocs >=1.6",
    "mkdocs-autorefs >=1.4",
    "mkdocs-coverage >=1.0",
    "mkdocs-git-revision-date-localized-plugin >=1.2",
    "mkdocs-llmstxt >=0.2",
    "mkdocs-material >=9.5",
    "mkdocs-minify-plugin >=0.8",
    "mkdocs-redirects >=1.2",
    "mkdocs-section-index >=0.3",
    "mkdocstrings[python]",
    "pydantic >=2.10",
]

[project.entry-points."compas.plugins"]
compas_model = "compas_model.plugins"

[project.urls]
Homepage = "https://blockresearchgroup.github.io/compas_model"
Documentation = "https://blockresearchgroup.github.io/compas_model"
Repository = "https://github.com/blockresearchgroup/compas_model.git"
Changelog = "https://github.com/blockresearchgroup/compas_model/blob/main/CHANGELOG.md"
Issues = "https://github.com/blockresearchgroup/compas_model/issues"
Forum = "https://forum.compas-framework.org/"

[tool.uv.sources]
compas = { git = "https://github.com/compas-dev/compas.git", rev = "3c1a2e8e0e5c4c14292ecf4bb38c82e5b977273e" }
compas-viewer = { git = "https://github.com/compas-dev/compas_viewer.git", rev = "cf5a5195bda840a511319d6b7201978af68c15e3" }

# ============================================================================
# setuptools config
# ============================================================================

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true
zip-safe = false

[tool.setuptools.dynamic]
version = { attr = "compas_model.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# ============================================================================
# replace pytest.ini
# ============================================================================

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests", "src/compas_model"]
python_files = ["test_*.py", "*_test.py", "test.py"]
addopts = ["-ra", "--strict-markers", "--tb=short", "--import-mode=importlib"]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "IGNORE_EXCEPTION_DETAIL",
    "ALLOW_UNICODE",
    "ALLOW_BYTES",
    "NUMBER",
]

# ============================================================================
# replace bumpversion.cfg
# ============================================================================

[tool.bumpversion]
current_version = "0.9.3"
message = "Bump version to {new_version}"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "src/compas_model/__init__.py"
search = "{current_version}"
replace = "{new_version}"

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "Unreleased"
replace = "[{new_version}] {now:%Y-%m-%d}"

# ============================================================================
# replace setup.cfg
# ============================================================================

[tool.ruff]
line-length = 179
indent-width = 4
target-version = "py312"
extend-include = ["examples/**/*.py", "docs/examples/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["I001"]
"tests/*" = ["I001"]
"tasks.py" = ["I001"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = [
    "compas",
    "compas_assembly",
    "compas_model",
    "compas_viewer",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 179

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pyright]
include = ["src/compas_model", "examples", "docs/examples", "tests/typing"]
pythonVersion = "3.12"
executionEnvironments = [
    { root = "examples/collision_detection", extraPaths = ["src", "examples", "examples/collision_detection"] },
    { root = "examples/contact_detection", extraPaths = ["src", "examples", "examples/contact_detection"] },
    { root = "examples/sectioning", extraPaths = ["src", "examples", "examples/sectioning"] },
    { root = "examples", extraPaths = ["src", "examples"] },
    { root = "src", extraPaths = ["src"] },
]
